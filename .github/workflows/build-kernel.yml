name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig yang dipakai'
        required: false
        default: 'lahaina_defconfig'
  push:
    branches:
      - release

env:
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'lahaina_defconfig' }}
  ARCH: arm64
  CLANG_VERSION: clang-r383902
  SOURCE_ROOT: ${{ github.workspace }}/source

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ── 1. Install dependencies ──
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex gcc git kmod \
            libssl-dev libelf-dev python3 rsync unzip wget zip python-is-python3

      # ── 2. Setup direktori workspace ──
      - name: Setup direktori
        run: |
          mkdir -p "$SOURCE_ROOT/prebuilts"
          mkdir -p "$SOURCE_ROOT/kernel_out"
          echo "KERNEL_DIR=$SOURCE_ROOT/msm-5.4" >> "$GITHUB_ENV"
          echo "PREBUILTS_PATH=$SOURCE_ROOT/prebuilts" >> "$GITHUB_ENV"
          echo "OUT_DIR=$SOURCE_ROOT/kernel_out" >> "$GITHUB_ENV"

      - name: Clone kernel source
        run: |
          if [ ! -d "$KERNEL_DIR" ]; then
            echo "cloning"
            git clone https://github.com/udyneo2/realme_GTmaster_Q3s_Q3t_9-5G-Speed-AndroidT-kernel-source.git "$KERNEL_DIR" --depth=1
          else
            echo "Dir already"
          fi

      # ── 3. Clone prebuilt tools ──
      - name: Clone prebuilt tools
        working-directory: ${{ env.PREBUILTS_PATH }}
        run: |
          if [ ! -d "build-tools" ]; then
            echo "Cloning build-tools..."
            git clone --depth=1 https://android.googlesource.com/platform/prebuilts/build-tools
          else
            echo "Dir already"
          fi

          if [ ! -d "linux-x86" ] && [ ! -d "clang" ]; then
            echo "Cloning clang host..."
            git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6573524.git clang/host/linux-x86/$CLANG_VERSION
          else
            echo "Dir already"
          fi

          if [ ! -d "gcc" ]; then
            echo "Cloning gcc..."
            git clone --depth=1 https://github.com/xiangfeidexiaohuo/GCC-4.9.git \
              gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          fi

          echo "Cloning selesai."
          df -h

      # ── 4. Export environment variables ──
      - name: Setup environment variables
        run: |
          MAKE_PATH="$PREBUILTS_PATH/build-tools/linux-x86/bin"
          GCC_TOOLCHAIN_PATH="$PREBUILTS_PATH/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
          GCC_BIN_PATH="$GCC_TOOLCHAIN_PATH/bin"
          CLANG_PATH="$PREBUILTS_PATH/clang/host/linux-x86/$CLANG_VERSION/bin"

          echo "GCC_TOOLCHAIN_PATH=$GCC_TOOLCHAIN_PATH" >> "$GITHUB_ENV"
          echo "GCC_CROSS_COMPILE=$GCC_BIN_PATH/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "$GCC_BIN_PATH" >> "$GITHUB_PATH"
          echo "$CLANG_PATH" >> "$GITHUB_PATH"
          echo "$MAKE_PATH" >> "$GITHUB_PATH"

      # ── 5. Verifikasi tools ──
      - name: Verifikasi path & tools
        run: |
          echo "--- Environment ---"
          echo "SOURCE_ROOT=$SOURCE_ROOT"
          echo "PREBUILTS_PATH=$PREBUILTS_PATH"
          echo "GCC_TOOLCHAIN_PATH=$GCC_TOOLCHAIN_PATH"
          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "OUT_DIR=$OUT_DIR"

          echo ""
          echo "--- Cek tool ---"
          ls -l "$(which make)" || echo "❌ Make not found!"
          ls -l "${GCC_CROSS_COMPILE}gcc" || echo "❌ GCC cross-compiler not found!"
          ls -l "${GCC_CROSS_COMPILE}ld" || echo "❌ GCC cross-linker not found!"
          ls -l "$(which clang)" || echo "❌ Clang compiler not found!"

          echo ""
          echo "--- Versi tool ---"
          make --version || echo "❌ Make check failed!"
          "${GCC_CROSS_COMPILE}gcc" --version || echo "❌ GCC check failed!"
          clang --version || echo "❌ Clang check failed!"
          df -h

      # ── 6. Build defconfig ──
      - name: Build kernel - make defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="clang --gcc-toolchain=$GCC_TOOLCHAIN_PATH" \
            HOSTCC="clang" \
            "$DEFCONFIG"

      # ── 7. Build Image & DTBs ──
      - name: Build kernel - Image & DTBs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="clang --gcc-toolchain=$GCC_TOOLCHAIN_PATH" \
            HOSTCC="clang"

      - name: Info hasil build
        run: |
          echo "=== ✅ Build selesai ==="
          df -h
          echo ""
          echo "--- Ukuran output ---"
          du -sh "$SOURCE_ROOT"/* 2>/dev/null || true
          du -sh "$OUT_DIR" 2>/dev/null || true
          echo ""
          echo "--- Output kernel ---"
          find "$OUT_DIR/arch/$ARCH/boot" -iname "Image*" -o -iname "*.dtb" 2>/dev/null

      # ── Upload artifact ──
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output-${{ github.run_number }}
          path: |
            source/kernel_out/arch/arm64/boot/Image*
            source/kernel_out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
          retention-days: 14
